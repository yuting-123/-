<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CarLog | 智慧車輛管理</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #F8FAFC; }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .card-shadow { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04); }
        .active-tab { color: #2563eb; transform: translateY(-2px); }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6 !important; }
        .page-transition { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 核心：確保從正確的 window 物件中取得 React 功能
        const { useState, useMemo, useEffect } = React;
        
        // 核心：修正 Lucide 圖標取得方式
        const { 
            Camera, Search, Trash2, Car, Clipboard, 
            Image: ImageIcon, ChevronLeft, Save, Plus, 
            Tag, LayoutGrid, History, Check, FolderOpen 
        } = window.lucideReact;

        const App = () => {
            const [currentView, setCurrentView] = useState('add');
            
            // 資料持久化
            const [records, setRecords] = useState(() => {
                try {
                    const saved = localStorage.getItem('carlog_v3_records');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });

            const [categories, setCategories] = useState(() => {
                try {
                    const saved = localStorage.getItem('carlog_v3_cats');
                    return saved ? JSON.parse(saved) : ['一般', '公務', '訪客', '黑名單'];
                } catch(e) { return ['一般', '公務', '訪客', '黑名單']; }
            });

            const [newCategoryName, setNewCategoryName] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [editData, setEditData] = useState(null);
            const [formData, setFormData] = useState({
                plate: '', brand: '', model: '', color: '', note: '',
                category: '一般', mediaType: 'image', mediaUrl: null
            });

            useEffect(() => { localStorage.setItem('carlog_v3_records', JSON.stringify(records)); }, [records]);
            useEffect(() => { localStorage.setItem('carlog_v3_cats', JSON.stringify(categories)); }, [categories]);

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormData({ ...formData, mediaUrl: reader.result, mediaType: file.type.startsWith('video') ? 'video' : 'image' });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddSubmit = (e) => {
                e.preventDefault();
                if (!formData.plate) return;
                const newRecord = { ...formData, id: Date.now(), timestamp: new Date().toLocaleString() };
                setRecords([newRecord, ...records]);
                setFormData({ plate: '', brand: '', model: '', color: '', note: '', category: categories[0], mediaType: 'image', mediaUrl: null });
                setCurrentView('list');
            };

            const filteredRecords = useMemo(() => {
                return records.filter(r => r.plate.toUpperCase().includes(searchQuery.toUpperCase()));
            }, [records, searchQuery]);

            // 分頁組件：新增
            const AddView = () => (
                <div className="page-transition space-y-6 max-w-xl mx-auto">
                    <div className="pt-4">
                        <h1 className="text-3xl font-black text-slate-900">新增紀錄</h1>
                        <p className="text-slate-500 font-medium">填寫車牌與車輛資訊</p>
                    </div>

                    <label className="block w-full h-56 bg-white rounded-[2rem] border-2 border-dashed border-slate-200 flex flex-col items-center justify-center cursor-pointer hover:bg-blue-50 transition-all overflow-hidden card-shadow relative">
                        {formData.mediaUrl ? (
                            formData.mediaType === 'image' ? <img src={formData.mediaUrl} className="w-full h-full object-cover" /> : <video src={formData.mediaUrl} className="w-full h-full object-cover" />
                        ) : (
                            <div className="text-center">
                                <div className="bg-blue-600 text-white p-4 rounded-2xl inline-block mb-3 shadow-lg shadow-blue-200"><Camera size={28} /></div>
                                <p className="font-bold text-slate-400 text-sm">點擊上傳照片</p>
                            </div>
                        )}
                        <input type="file" accept="image/*,video/*" capture="environment" className="hidden" onChange={handleFileChange} />
                    </label>

                    <div className="bg-white rounded-[2rem] p-6 card-shadow space-y-5">
                        <div className="space-y-1">
                            <label className="text-xs font-black text-slate-400 uppercase tracking-tighter ml-1">車牌號碼</label>
                            <input className="w-full text-2xl font-black bg-slate-50 border-2 border-transparent rounded-xl px-4 py-3 uppercase focus:bg-white" placeholder="ABC-1234" value={formData.plate} onChange={e => setFormData({...formData, plate: e.target.value})} />
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div className="space-y-1">
                                <label className="text-xs font-black text-slate-400 ml-1">分類</label>
                                <select className="w-full bg-slate-50 border-2 border-transparent rounded-xl px-4 py-3 font-bold" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}>
                                    {categories.map(c => <option key={c}>{c}</option>)}
                                </select>
                            </div>
                            <div className="space-y-1">
                                <label className="text-xs font-black text-slate-400 ml-1">車色</label>
                                <input className="w-full bg-slate-50 border-2 border-transparent rounded-xl px-4 py-3 font-bold" placeholder="銀色" value={formData.color} onChange={e => setFormData({...formData, color: e.target.value})} />
                            </div>
                        </div>
                        <div className="space-y-1">
                            <label className="text-xs font-black text-slate-400 ml-1">備註內容</label>
                            <textarea rows="2" className="w-full bg-slate-50 border-2 border-transparent rounded-xl px-4 py-3 font-bold resize-none" placeholder="..." value={formData.note} onChange={e => setFormData({...formData, note: e.target.value})} />
                        </div>
                        <button onClick={handleAddSubmit} className="w-full bg-blue-600 text-white py-4 rounded-xl font-black text-lg shadow-xl shadow-blue-100 active:scale-95 transition-all">儲存紀錄</button>
                    </div>
                </div>
            );

            // 分頁組件：列表
            const ListView = () => (
                <div className="page-transition space-y-6">
                    <div className="pt-4">
                        <h1 className="text-3xl font-black text-slate-900">車輛紀錄</h1>
                        <p className="text-slate-500 font-medium">目前共 {records.length} 筆</p>
                    </div>

                    <div className="relative">
                        <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" size={20} />
                        <input className="w-full bg-white card-shadow rounded-xl py-4 pl-12 pr-4 font-bold border-none" placeholder="搜尋車牌..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pb-24">
                        {filteredRecords.map(r => (
                            <div key={r.id} onClick={() => { setEditData(r); setCurrentView('details'); }} className="bg-white p-4 rounded-2xl card-shadow flex items-center gap-4 hover:border-blue-500 border-2 border-transparent transition-all cursor-pointer group">
                                <div className="w-20 h-20 bg-slate-50 rounded-xl overflow-hidden flex-shrink-0">
                                    {r.mediaUrl ? <img src={r.mediaUrl} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-slate-200"><Car size={32} /></div>}
                                </div>
                                <div className="flex-1">
                                    <span className="text-[10px] font-black bg-blue-50 text-blue-600 px-2 py-0.5 rounded uppercase">{r.category}</span>
                                    <h3 className="text-xl font-black text-slate-800 uppercase leading-tight group-hover:text-blue-600 transition-colors">{r.plate}</h3>
                                    <p className="text-slate-400 text-xs font-bold">{r.timestamp}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // 分頁組件：詳情
            const DetailView = () => (
                <div className="page-transition space-y-6 max-w-2xl mx-auto">
                    <button onClick={() => setCurrentView('list')} className="text-blue-600 font-black flex items-center gap-1"><ChevronLeft size={20} /> 返回清單</button>
                    <div className="bg-white rounded-[2rem] overflow-hidden card-shadow border border-white">
                        <div className="h-64 bg-slate-900 flex items-center justify-center">
                            {editData.mediaUrl ? (
                                editData.mediaType === 'image' ? <img src={editData.mediaUrl} className="w-full h-full object-contain" /> : <video src={editData.mediaUrl} controls className="w-full h-full" />
                            ) : <Car size={64} className="text-slate-700" />}
                        </div>
                        <div className="p-8 space-y-6">
                            <div className="flex justify-between items-center">
                                <h2 className="text-4xl font-black text-blue-600 uppercase">{editData.plate}</h2>
                                <button onClick={() => { if(confirm('確定刪除？')) { setRecords(records.filter(r => r.id !== editData.id)); setCurrentView('list'); } }} className="text-red-400 p-2"><Trash2 /></button>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-slate-50 p-4 rounded-2xl"><p className="text-[10px] font-black text-slate-400 mb-1">分類標籤</p><p className="font-bold">{editData.category}</p></div>
                                <div className="bg-slate-50 p-4 rounded-2xl"><p className="text-[10px] font-black text-slate-400 mb-1">車身顏色</p><p className="font-bold">{editData.color || '未填寫'}</p></div>
                            </div>
                            <div className="bg-slate-50 p-4 rounded-2xl"><p className="text-[10px] font-black text-slate-400 mb-1">備註說明</p><p className="font-bold text-slate-600">{editData.note || '無備註'}</p></div>
                        </div>
                    </div>
                </div>
            );

            // 分頁組件：分類管理
            const CategoryView = () => (
                <div className="page-transition space-y-6">
                    <div className="pt-4">
                        <h1 className="text-3xl font-black text-slate-900">分類管理</h1>
                    </div>
                    <div className="flex gap-2">
                        <input className="flex-1 bg-white card-shadow rounded-xl px-4 py-3 font-bold" placeholder="輸入新標籤..." value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} />
                        <button onClick={() => { if(newCategoryName) { setCategories([...categories, newCategoryName]); setNewCategoryName(''); } }} className="bg-blue-600 text-white px-6 rounded-xl font-bold"><Plus /></button>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        {categories.map(c => (
                            <div key={c} className="bg-white p-6 rounded-2xl card-shadow flex flex-col justify-between h-32 border-2 border-transparent">
                                <div className="flex justify-between items-start">
                                    <div className="p-2 bg-blue-50 text-blue-600 rounded-lg"><Tag size={20} /></div>
                                    <button onClick={() => { if(c!=='一般') setCategories(categories.filter(x => x!==c)) }} className="text-slate-200 hover:text-red-500 transition-all"><Trash2 size={18} /></button>
                                </div>
                                <h3 className="text-xl font-black">{c}</h3>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-32 px-6">
                    <div className="max-w-4xl mx-auto">
                        {currentView === 'add' && <AddView />}
                        {currentView === 'list' && <ListView />}
                        {currentView === 'details' && <DetailView />}
                        {currentView === 'category' && <CategoryView />}
                    </div>

                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass rounded-3xl px-8 py-4 flex justify-between items-center shadow-2xl z-50 border border-white/50">
                        <button onClick={() => setCurrentView('add')} className={`flex flex-col items-center gap-1 transition-all ${currentView === 'add' ? 'active-tab' : 'text-slate-300'}`}>
                            <Plus size={24} strokeWidth={3} /><span className="text-[10px] font-black uppercase">新增</span>
                        </button>
                        <button onClick={() => setCurrentView('list')} className={`flex flex-col items-center gap-1 transition-all ${currentView === 'list' || currentView === 'details' ? 'active-tab' : 'text-slate-300'}`}>
                            <LayoutGrid size={24} strokeWidth={3} /><span className="text-[10px] font-black uppercase">紀錄</span>
                        </button>
                        <button onClick={() => setCurrentView('category')} className={`flex flex-col items-center gap-1 transition-all ${currentView === 'category' ? 'active-tab' : 'text-slate-300'}`}>
                            <Tag size={24} strokeWidth={3} /><span className="text-[10px] font-black uppercase">分類</span>
                        </button>
                    </nav>
                </div>
            );
        };

        // 啟動渲染
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
