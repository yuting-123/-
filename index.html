<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>車牌辨識管理系統</title>
    <!-- PWA 相關設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/743/743917.png">

    <!-- 載入實用的 CSS 與 框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 載入圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overscroll-behavior-y: contain; /* 防止下拉重新整理影響操作 */
        }

        /* 平滑過渡動畫 */
        .page-enter { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input:focus, select:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // 註冊 Service Worker 以支援 PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW registered');
                }).catch(err => console.log('SW registration failed', err));
            });
        }

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('add');
            const [records, setRecords] = useState(() => {
                // 從本地儲存讀取資料，模擬 APP 的持久化儲存
                const saved = localStorage.getItem('car_records');
                return saved ? JSON.parse(saved) : [];
            });
            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem('car_categories');
                return saved ? JSON.parse(saved) : ['一般', '公務', '訪客', '違規', '黑名單'];
            });
            const [newCategoryName, setNewCategoryName] = useState('');
            const [viewingCategory, setViewingCategory] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [editData, setEditData] = useState(null);

            const [formData, setFormData] = useState({
                plate: '', brand: '', model: '', color: '', note: '', category: '一般', mediaType: 'image', mediaUrl: null
            });

            // 當資料變動時儲存到本地
            useEffect(() => {
                localStorage.setItem('car_records', JSON.stringify(records));
            }, [records]);

            useEffect(() => {
                localStorage.setItem('car_categories', JSON.stringify(categories));
            }, [categories]);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            const normalizePlate = (plate) => plate.replace(/[\s-]/g, '').toUpperCase();

            const handleFileChange = (e, isEdit = false) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64String = reader.result;
                        const type = file.type.startsWith('video') ? 'video' : 'image';
                        if (isEdit) setEditData({ ...editData, mediaUrl: base64String, mediaType: type });
                        else setFormData({ ...formData, mediaUrl: base64String, mediaType: type });
                    };
                    reader.readAsDataURL(file); // 使用 Base64 以便持久化儲存
                }
            };

            const handleAddSubmit = (e) => {
                e.preventDefault();
                if (!formData.plate) return;
                const newRecord = { ...formData, id: Date.now(), timestamp: new Date().toLocaleString() };
                setRecords([newRecord, ...records]);
                setFormData({ plate: '', brand: '', model: '', color: '', note: '', category: categories[0] || '一般', mediaType: 'image', mediaUrl: null });
                setCurrentView('list');
            };

            const handleUpdateRecord = () => {
                setRecords(records.map(r => r.id === editData.id ? editData : r));
                setCurrentView('list');
            };

            const addCategory = () => {
                if (newCategoryName && !categories.includes(newCategoryName)) {
                    setCategories([...categories, newCategoryName]);
                    setNewCategoryName('');
                }
            };

            const deleteCategory = (catName) => {
                if (confirm(`確定要刪除「${catName}」分類嗎？此分類下的車輛將變為「一般」。`)) {
                    setCategories(categories.filter(c => c !== catName));
                    setRecords(records.map(r => r.category === catName ? { ...r, category: '一般' } : r));
                }
            };

            const filteredRecords = useMemo(() => {
                const target = normalizePlate(searchQuery);
                if (!target) return records;
                return records.filter(record => normalizePlate(record.plate).includes(target));
            }, [records, searchQuery]);

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    <header className="bg-white/80 backdrop-blur-md px-6 py-4 flex items-center justify-between border-b sticky top-0 z-40">
                        <div className="flex items-center gap-2">
                            <div className="bg-blue-600 p-2 rounded-xl text-white">
                                <Icon name="car" size={20} />
                            </div>
                            <span className="font-black text-xl tracking-tighter text-slate-800">車牌紀錄 APP</span>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto no-scrollbar bg-slate-50 p-5 pb-32">
                        {currentView === 'add' && (
                            <div className="page-enter space-y-6">
                                <h2 className="text-2xl font-black text-slate-800 tracking-tight">新增車輛</h2>
                                <form onSubmit={handleAddSubmit} className="space-y-6">
                                    <div className="flex justify-center">
                                        <label className="relative cursor-pointer active:scale-95 transition-transform">
                                            <div className="w-44 h-44 rounded-[2.5rem] border-4 border-dashed border-blue-200 flex flex-col items-center justify-center bg-white shadow-xl overflow-hidden">
                                                {formData.mediaUrl ? (
                                                    formData.mediaType === 'image' ? <img src={formData.mediaUrl} className="w-full h-full object-cover" /> : <video src={formData.mediaUrl} className="w-full h-full object-cover" />
                                                ) : (
                                                    <div className="text-center">
                                                        <div className="bg-blue-50 p-4 rounded-full mb-2 inline-block">
                                                            <Icon name="camera" className="text-blue-600" size={32} />
                                                        </div>
                                                        <p className="text-xs text-blue-600 font-bold">拍攝車照</p>
                                                    </div>
                                                )}
                                            </div>
                                            <input type="file" accept="image/*,video/*" capture="environment" className="hidden" onChange={e => handleFileChange(e)} />
                                        </label>
                                    </div>

                                    <div className="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 space-y-5">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-wider ml-1">車牌號碼</label>
                                            <input required type="text" className="w-full px-5 py-4 bg-slate-50 rounded-2xl border-none uppercase font-mono text-2xl font-bold text-blue-600 tracking-widest" placeholder="ABC-1234" value={formData.plate} onChange={e => setFormData({...formData, plate: e.target.value})} />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-wider ml-1">分類</label>
                                            <select className="w-full px-5 py-4 bg-slate-50 rounded-2xl border-none font-bold text-slate-700 appearance-none" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}>
                                                {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <input type="text" placeholder="廠牌" className="w-full px-5 py-3 bg-slate-50 rounded-2xl border-none text-sm font-bold" value={formData.brand} onChange={e => setFormData({...formData, brand: e.target.value})} />
                                            <input type="text" placeholder="顏色" className="w-full px-5 py-3 bg-slate-50 rounded-2xl border-none text-sm font-bold" value={formData.color} onChange={e => setFormData({...formData, color: e.target.value})} />
                                        </div>
                                        <textarea rows="3" className="w-full px-5 py-3 bg-slate-50 rounded-2xl border-none resize-none text-sm" placeholder="輸入備註資訊..." value={formData.note} onChange={e => setFormData({...formData, note: e.target.value})} />
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white py-5 rounded-[1.5rem] font-black text-lg shadow-xl shadow-blue-200 active:scale-95 transition-all">
                                        儲存紀錄
                                    </button>
                                </form>
                            </div>
                        )}

                        {currentView === 'list' && (
                            <div className="page-enter space-y-5">
                                <h2 className="text-2xl font-black text-slate-800 tracking-tight">紀錄查詢</h2>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-5 flex items-center pointer-events-none">
                                        <Icon name="search" size={20} className="text-slate-400" />
                                    </div>
                                    <input type="text" placeholder="搜尋車牌..." className="w-full pl-14 pr-6 py-4 rounded-2xl border-none shadow-sm bg-white font-medium" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                                </div>
                                <div className="grid grid-cols-1 gap-4">
                                    {filteredRecords.map(r => (
                                        <div key={r.id} onClick={() => { setEditData({...r}); setCurrentView('details'); }} className="bg-white p-4 rounded-[1.5rem] shadow-sm border flex items-center gap-4 active:scale-95 transition-all cursor-pointer">
                                            <div className="w-16 h-16 bg-slate-50 rounded-xl overflow-hidden flex-shrink-0">
                                                {r.mediaUrl ? <img src={r.mediaUrl} className="w-full h-full object-cover" /> : <div className="m-auto h-full flex"><Icon name="car" className="m-auto text-slate-200" size={32} /></div>}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <span className="text-[10px] font-bold px-2 py-0.5 bg-blue-50 text-blue-600 rounded-lg uppercase inline-block mb-1">{r.category}</span>
                                                <h3 className="text-lg font-black text-slate-800 uppercase leading-tight">{r.plate}</h3>
                                            </div>
                                            <Icon name="chevron-right" size={20} className="text-slate-300" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {currentView === 'category' && (
                            <div className="page-enter space-y-6">
                                {viewingCategory ? (
                                    <div className="space-y-4">
                                        <button onClick={() => setViewingCategory(null)} className="text-blue-600 font-black flex items-center gap-1"><Icon name="arrow-left" size={18} /> 返回</button>
                                        <h2 className="text-2xl font-black">{viewingCategory}</h2>
                                        <div className="space-y-3">
                                            {records.filter(r => r.category === viewingCategory).map(r => (
                                                <div key={r.id} className="bg-white p-4 rounded-2xl border flex justify-between items-center shadow-sm">
                                                    <span className="font-black uppercase text-slate-700">{r.plate}</span>
                                                    <button onClick={() => setRecords(records.filter(rec => rec.id !== r.id))} className="text-red-300"><Icon name="trash-2" size={18}/></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        <h2 className="text-2xl font-black">分類管理</h2>
                                        <div className="bg-white p-4 rounded-2xl shadow-sm border flex gap-3">
                                            <input type="text" placeholder="新分類..." className="flex-1 bg-slate-50 border-none rounded-xl px-4 font-bold" value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} />
                                            <button onClick={addCategory} className="bg-blue-600 text-white p-3 rounded-xl"><Icon name="plus" /></button>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            {categories.map(c => (
                                                <div key={c} onClick={() => setViewingCategory(c)} className="bg-white p-6 rounded-[1.5rem] border flex flex-col justify-between h-36 active:scale-95 transition-all shadow-sm">
                                                    <div className="flex justify-between items-start">
                                                        <div className="bg-blue-50 p-2 rounded-lg text-blue-600"><Icon name="folder" size={20} /></div>
                                                        <button onClick={(e) => { e.stopPropagation(); deleteCategory(c); }} className="text-slate-200"><Icon name="x" size={16} /></button>
                                                    </div>
                                                    <span className="font-black text-lg block">{c}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {currentView === 'details' && editData && (
                            <div className="page-enter space-y-6">
                                <div className="flex justify-between items-center">
                                    <button onClick={() => setCurrentView('list')} className="text-blue-600 font-black flex items-center gap-1"><Icon name="arrow-left" size={18} /> 返回</button>
                                    <button onClick={handleUpdateRecord} className="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black flex items-center gap-2 shadow-lg shadow-blue-100"><Icon name="save" size={18}/> 儲存</button>
                                </div>
                                <div className="bg-white rounded-[2.5rem] overflow-hidden border shadow-xl">
                                    <div className="aspect-video bg-slate-900 relative">
                                        {editData.mediaUrl ? (editData.mediaType === 'image' ? <img src={editData.mediaUrl} className="w-full h-full object-contain" /> : <video src={editData.mediaUrl} controls className="w-full h-full" />) : <div className="w-full h-full flex flex-col items-center justify-center text-slate-600"><Icon name="image" size={48} /></div>}
                                    </div>
                                    <div className="p-8 space-y-6">
                                        <div className="bg-slate-50 p-5 rounded-2xl">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">車牌號碼</label>
                                            <input className="w-full bg-transparent font-black text-2xl text-blue-700 uppercase border-none p-0 focus:ring-0" value={editData.plate} onChange={e => setEditData({...editData, plate: e.target.value})} />
                                        </div>
                                        <div className="bg-slate-50 p-5 rounded-2xl">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">備註</label>
                                            <textarea rows="4" className="w-full bg-transparent border-none p-0 focus:ring-0 text-sm" value={editData.note} onChange={e => setEditData({...editData, note: e.target.value})} />
                                        </div>
                                    </div>
                                </div>
                                <button onClick={() => { setRecords(records.filter(r => r.id !== editData.id)); setCurrentView('list'); }} className="w-full py-4 text-red-400 font-black text-sm uppercase">刪除紀錄</button>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-xl border-t px-8 py-4 flex justify-around items-center z-50 shadow-[0_-10px_25px_rgba(0,0,0,0.05)]">
                        <button onClick={() => setCurrentView('add')} className={`flex flex-col items-center gap-1 ${currentView === 'add' ? 'text-blue-600' : 'text-slate-300'}`}>
                            <Icon name="plus" size={24} strokeWidth={3} />
                            <span className="text-[10px] font-black uppercase">新增</span>
                        </button>
                        <button onClick={() => setCurrentView('list')} className={`flex flex-col items-center gap-1 ${currentView === 'list' || currentView === 'details' ? 'text-blue-600' : 'text-slate-300'}`}>
                            <Icon name="layout-grid" size={24} strokeWidth={3} />
                            <span className="text-[10px] font-black uppercase">查詢</span>
                        </button>
                        <button onClick={() => setCurrentView('category')} className={`flex flex-col items-center gap-1 ${currentView === 'category' ? 'text-blue-600' : 'text-slate-300'}`}>
                            <Icon name="tag" size={24} strokeWidth={3} />
                            <span className="text-[10px] font-black uppercase">分類</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
