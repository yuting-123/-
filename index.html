<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CarLog | 智慧車輛管理</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .card-shadow { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); }
        .active-tab { color: #2563eb; transform: translateY(-2px); }
        input:focus, select:focus, textarea:focus { outline: none; border: 2px solid #3b82f6 !important; }
        /* 動畫 */
        .page-transition { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { 
            Camera, Search, Trash2, Car, Clipboard, 
            Image: ImageIcon, ChevronLeft, Save, Plus, 
            Tag, LayoutGrid, History, Check, FolderOpen, MoreHorizontal
        } = lucideReact;

        const App = () => {
            const [currentView, setCurrentView] = useState('add');
            
            // 持久化資料邏輯
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem('carlog_v2_records');
                return saved ? JSON.parse(saved) : [];
            });
            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem('carlog_v2_cats');
                return saved ? JSON.parse(saved) : ['一般', '公務', '訪客', '黑名單'];
            });

            const [newCategoryName, setNewCategoryName] = useState('');
            const [selectedRecordId, setSelectedRecordId] = useState(null);
            const [viewingCategory, setViewingCategory] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [editData, setEditData] = useState(null);

            const [formData, setFormData] = useState({
                plate: '', brand: '', model: '', color: '', note: '',
                category: '一般', mediaType: 'image', mediaUrl: null
            });

            // 自動儲存
            useEffect(() => { localStorage.setItem('carlog_v2_records', JSON.stringify(records)); }, [records]);
            useEffect(() => { localStorage.setItem('carlog_v2_cats', JSON.stringify(categories)); }, [categories]);

            const handleFileChange = (e, isEdit = false) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const type = file.type.startsWith('video') ? 'video' : 'image';
                        if (isEdit) setEditData({ ...editData, mediaUrl: reader.result, mediaType: type });
                        else setFormData({ ...formData, mediaUrl: reader.result, mediaType: type });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddSubmit = (e) => {
                e.preventDefault();
                if (!formData.plate) return;
                const newRecord = { ...formData, id: Date.now(), timestamp: new Date().toLocaleString() };
                setRecords([newRecord, ...records]);
                setFormData({ plate: '', brand: '', model: '', color: '', note: '', category: categories[0], mediaType: 'image', mediaUrl: null });
                setCurrentView('list');
            };

            const deleteRecord = (id) => {
                if(confirm('確認刪除此紀錄？')) {
                    setRecords(records.filter(r => r.id !== id));
                    if (currentView === 'details') setCurrentView('list');
                }
            };

            const filteredRecords = useMemo(() => {
                const q = searchQuery.toUpperCase();
                return records.filter(r => r.plate.toUpperCase().includes(q));
            }, [records, searchQuery]);

            const renderView = () => {
                switch (currentView) {
                    case 'add': return (
                        <div className="page-transition max-w-2xl mx-auto space-y-8 pb-10">
                            <header>
                                <h1 className="text-4xl font-extrabold text-slate-900 tracking-tight">新增車輛</h1>
                                <p className="text-slate-500 mt-1">快速掃描並存儲入庫紀錄</p>
                            </header>

                            <div className="flex justify-center">
                                <label className="w-full h-64 bg-white rounded-[2.5rem] border-2 border-dashed border-blue-200 flex flex-col items-center justify-center cursor-pointer hover:bg-blue-50 transition-all overflow-hidden relative group card-shadow">
                                    {formData.mediaUrl ? (
                                        formData.mediaType === 'image' ? <img src={formData.mediaUrl} className="w-full h-full object-cover" /> : <video src={formData.mediaUrl} className="w-full h-full object-cover" />
                                    ) : (
                                        <div className="text-center">
                                            <div className="bg-blue-600 text-white p-4 rounded-full inline-block mb-3 shadow-lg shadow-blue-200"><Camera size={32} /></div>
                                            <p className="font-bold text-blue-600">點擊開啟相機</p>
                                        </div>
                                    )}
                                    <input type="file" accept="image/*,video/*" capture="environment" className="hidden" onChange={(e) => handleFileChange(e)} />
                                </label>
                            </div>

                            <div className="bg-white rounded-[2.5rem] p-8 card-shadow space-y-6">
                                <div className="space-y-2">
                                    <label className="text-sm font-bold text-slate-400 uppercase tracking-wider ml-1">車牌號碼</label>
                                    <input required className="w-full text-3xl font-black bg-slate-50 border-2 border-slate-50 rounded-2xl px-6 py-4 uppercase placeholder:text-slate-200" placeholder="ABC-1234" value={formData.plate} onChange={e => setFormData({...formData, plate: e.target.value})} />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-2">
                                        <label className="text-sm font-bold text-slate-400 ml-1">分類標籤</label>
                                        <select className="w-full bg-slate-50 border-2 border-slate-50 rounded-2xl px-5 py-4 font-bold appearance-none" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}>
                                            {categories.map(c => <option key={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-sm font-bold text-slate-400 ml-1">車輛顏色</label>
                                        <input className="w-full bg-slate-50 border-2 border-slate-50 rounded-2xl px-5 py-4 font-bold" placeholder="例如：銀色" value={formData.color} onChange={e => setFormData({...formData, color: e.target.value})} />
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-sm font-bold text-slate-400 ml-1">備註</label>
                                    <textarea rows="3" className="w-full bg-slate-50 border-2 border-slate-50 rounded-2xl px-5 py-4 font-bold resize-none" placeholder="輸入備註..." value={formData.note} onChange={e => setFormData({...formData, note: e.target.value})} />
                                </div>
                                <button onClick={handleAddSubmit} className="w-full bg-blue-600 text-white py-5 rounded-2xl font-extrabold text-xl shadow-xl shadow-blue-100 hover:bg-blue-700 active:scale-95 transition-all">完成並儲存</button>
                            </div>
                        </div>
                    );

                    case 'list': return (
                        <div className="page-transition space-y-6">
                            <header className="flex justify-between items-end">
                                <div>
                                    <h1 className="text-4xl font-extrabold">所有紀錄</h1>
                                    <p className="text-slate-500">目前共有 {records.length} 筆資料</p>
                                </div>
                            </header>

                            <div className="relative">
                                <Search className="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300" size={24} />
                                <input className="w-full bg-white card-shadow rounded-2xl py-5 pl-14 pr-6 font-bold text-lg placeholder:text-slate-300 border-none" placeholder="搜尋車牌..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pb-20">
                                {filteredRecords.map(r => (
                                    <div key={r.id} onClick={() => { setEditData(r); setCurrentView('details'); }} className="bg-white p-4 rounded-3xl card-shadow flex items-center gap-5 hover:scale-[1.02] transition-all cursor-pointer border-2 border-transparent hover:border-blue-500">
                                        <div className="w-24 h-24 bg-slate-100 rounded-2xl overflow-hidden flex-shrink-0">
                                            {r.mediaUrl ? <img src={r.mediaUrl} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-slate-300"><Car size={32} /></div>}
                                        </div>
                                        <div className="flex-1">
                                            <span className="text-[10px] font-extrabold bg-blue-50 text-blue-600 px-2 py-1 rounded-md mb-2 inline-block uppercase tracking-wider">{r.category}</span>
                                            <h3 className="text-2xl font-black text-slate-800 uppercase leading-none">{r.plate}</h3>
                                            <p className="text-slate-400 text-sm mt-1 font-semibold">{r.timestamp}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );

                    case 'details': return (
                        <div className="page-transition max-w-3xl mx-auto space-y-6 pb-20">
                            <button onClick={() => setCurrentView('list')} className="bg-white p-3 rounded-xl card-shadow font-bold flex items-center gap-2"><ChevronLeft size={20} /> 返回</button>
                            <div className="bg-white rounded-[3rem] overflow-hidden card-shadow">
                                <div className="h-80 bg-slate-900 relative">
                                    {editData.mediaUrl ? (
                                        editData.mediaType === 'image' ? <img src={editData.mediaUrl} className="w-full h-full object-contain" /> : <video src={editData.mediaUrl} controls className="w-full h-full" />
                                    ) : (
                                        <div className="w-full h-full flex flex-col items-center justify-center text-slate-500 italic"><ImageIcon size={64} /></div>
                                    )}
                                </div>
                                <div className="p-8 space-y-8">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-4xl font-black uppercase text-blue-600">{editData.plate}</h2>
                                        <button onClick={() => deleteRecord(editData.id)} className="bg-red-50 text-red-500 p-4 rounded-2xl hover:bg-red-100 transition-all"><Trash2 /></button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-8">
                                        <div className="bg-slate-50 p-6 rounded-3xl">
                                            <p className="text-xs font-black text-slate-400 uppercase mb-1">分類</p>
                                            <p className="text-lg font-bold">{editData.category}</p>
                                        </div>
                                        <div className="bg-slate-50 p-6 rounded-3xl">
                                            <p className="text-xs font-black text-slate-400 uppercase mb-1">建立時間</p>
                                            <p className="text-lg font-bold">{editData.timestamp}</p>
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-3xl">
                                        <p className="text-xs font-black text-slate-400 uppercase mb-1">備註</p>
                                        <p className="text-lg font-bold leading-relaxed">{editData.note || '無備註內容'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    );

                    case 'category': return (
                        <div className="page-transition space-y-8 pb-20">
                            <header>
                                <h1 className="text-4xl font-extrabold">分類管理</h1>
                                <p className="text-slate-500">自定義標籤來過濾紀錄</p>
                            </header>

                            <div className="bg-white p-6 rounded-[2.5rem] card-shadow flex gap-3">
                                <input className="flex-1 bg-slate-50 rounded-2xl px-6 font-bold" placeholder="新增分類名稱..." value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} />
                                <button onClick={() => { if(newCategoryName) { setCategories([...categories, newCategoryName]); setNewCategoryName(''); } }} className="bg-blue-600 text-white p-5 rounded-2xl font-bold"><Plus /></button>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                {categories.map(c => (
                                    <div key={c} className="bg-white p-8 rounded-[2.5rem] card-shadow flex flex-col justify-between h-48 group hover:border-blue-500 border-2 border-transparent transition-all">
                                        <div className="flex justify-between">
                                            <div className="bg-blue-50 text-blue-600 p-4 rounded-2xl"><FolderOpen /></div>
                                            <button onClick={() => setCategories(categories.filter(x => x !== c))} className="text-slate-200 hover:text-red-500 transition-all"><Trash2 /></button>
                                        </div>
                                        <div>
                                            <h3 className="text-2xl font-black">{c}</h3>
                                            <p className="font-bold text-slate-400">{records.filter(r => r.category === c).length} 筆資料</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }
            };

            return (
                <div className="min-h-screen">
                    <main className="max-w-4xl mx-auto px-6 pt-10 pb-32">
                        {renderView()}
                    </main>

                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md glass rounded-[2.5rem] px-8 py-5 flex justify-between items-center shadow-2xl z-50 border border-white/50">
                        <button onClick={() => setCurrentView('add')} className={`flex flex-col items-center gap-1 transition-all ${currentView === 'add' ? 'active-tab' : 'text-slate-300'}`}>
                            <Plus size={28} strokeWidth={3} /><span className="text-[10px] font-black uppercase">新增</span>
                        </button>
                        <button onClick={() => setCurrentView('list')} className={`flex flex-col items-center gap-1 transition-all ${currentView === 'list' || currentView === 'details' ? 'active-tab' : 'text-slate-300'}`}>
                            <LayoutGrid size={28} strokeWidth={3} /><span className="text-[10px] font-black uppercase">紀錄</span>
                        </button>
                        <button onClick={() => setCurrentView('category')} className={`flex flex-col items-center gap-1 transition-all ${currentView === 'category' ? 'active-tab' : 'text-slate-300'}`}>
                            <Tag size={28} strokeWidth={3} /><span className="text-[10px] font-black uppercase">分類</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
